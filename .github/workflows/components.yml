name: Components Tests

on:
  pull_request:
    types: [review_requested]
    paths:
      - "packages/components/src/**/*.tsx"
      - "packages/components/src/**/*.snap"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: packages/components/yarn.lock
          
      - name: Install dependencies
        run: |
          cd packages/components
          yarn install --frozen-lockfile
        env:
          SKIP_SASS_BINARY_DOWNLOAD_FOR_CI: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          SASS_BINARY_SITE: https://github.com/sass/node-sass/releases/download
          npm_config_cache: /tmp/.npm
          YARN_CACHE_FOLDER: /tmp/.yarn
        
      - name: Run Stencil tests
        run: cd packages/components && yarn test --spec --e2e
        timeout-minutes: 20
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions"
          CHROME_BIN: /usr/bin/google-chrome
          CHROME_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu"
