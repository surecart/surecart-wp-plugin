name: Components Tests

on:
  pull_request:
    types: [review_requested]
    paths:
      - "packages/components/src/**/*.tsx"
      - "packages/components/src/**/*.snap"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: cd packages/components && yarn
      - run: cd packages/components && rm -rf dist
      - run: cd packages/components && yarn test --spec --e2e
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions"
